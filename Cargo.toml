[package]
name = "bruce-test-app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "To test the vscode extension"
repository = "https://github.com/bruceskingle/bruce-test-app"
# An app, released as installers on GitHub, not on crates.io.
publish = false

[workspace]
members = ["core"]

[package.metadata.bruce-method]
kind = "app"
workflow = "release.yml"
installers = [
    { platform = "macos-aarch64", file = "BruceTestApp_{version}_aarch64.dmg" },
    { platform = "macos-x64", file = "BruceTestApp_{version}_x86_64.dmg" },
    { platform = "windows-x64", file = "BruceTestApp_{version}_x64-setup.exe" },
    { platform = "windows-arm64", file = "BruceTestApp_{version}_arm64-setup.exe" },
]

[dependencies]
dioxus = "0.7.10"
bruce-test-app-core = { version = "0.1.0", path = "core" }

# dx builds the app for the desktop with the feature named for the platform.
[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
